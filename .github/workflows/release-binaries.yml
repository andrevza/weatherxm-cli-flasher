name: Standalone release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.ref_name != 'v0.1.1-rc.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            file: weatherxm-flash-linux-arm64
            node_version: 26.8.2
          - runner: ubuntu-22.04
            target: linux-x64
            file: weatherxm-flash-linux-x64
            node_version: 26.13.0
          - runner: macos-14
            target: darwin-arm64
            file: weatherxm-flash-macos-arm64
            node_version: 26.13.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux ARM64 runtime dependency for standalone tests
        if: matrix.target == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@v4
        with:
          # Linux ARM64 stays on the last release before the SEA page-alignment
          # regression. Other targets use the current patched release.
          node-version: ${{ matrix.node_version }}
      - run: npm ci
      - name: Capture pristine Node ELF layout
        if: matrix.target == 'linux-arm64'
        run: |
          node --version
          readelf -lW "$(command -v node)"
          readelf -dW "$(command -v node)"
      - run: npm run build:standalone
      - name: Validate Linux ARM64 executable and native addon ELF layout
        if: matrix.target == 'linux-arm64'
        run: |
          node scripts/validate-linux-elf.mjs \
            ./dist/${{ matrix.file }} \
            ./node_modules/@serialport/bindings-cpp/prebuilds/linux-arm64/@serialport+bindings-cpp.armv8.glibc.node \
            "$(command -v node)"
          readelf -lW ./dist/${{ matrix.file }}
          readelf -dW ./dist/${{ matrix.file }}
          readelf -dW ./node_modules/@serialport/bindings-cpp/prebuilds/linux-arm64/@serialport+bindings-cpp.armv8.glibc.node
          ldd ./dist/${{ matrix.file }}
          ldd ./node_modules/@serialport/bindings-cpp/prebuilds/linux-arm64/@serialport+bindings-cpp.armv8.glibc.node
          if ldd ./dist/${{ matrix.file }} ./node_modules/@serialport/bindings-cpp/prebuilds/linux-arm64/@serialport+bindings-cpp.armv8.glibc.node | grep -q 'not found'; then
            echo 'Unresolved dynamic dependency in Linux ARM64 standalone package' >&2
            exit 1
          fi
      - name: Smoke test standalone executable
        run: |
          ./dist/${{ matrix.file }} --version
          ./dist/${{ matrix.file }} --version --verbose --json
          ./dist/${{ matrix.file }} --help
          ./dist/${{ matrix.file }} firmware list --json
      - name: Test embedded native binding from an isolated directory
        env:
          WG1200_STANDALONE_BINARY: ${{ github.workspace }}/dist/${{ matrix.file }}
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  read-only-hardware-gate:
    needs: build
    if: github.ref_name != 'v0.1.1-rc.1'
    # Configure a self-hosted Linux ARM64 runner with a WG1200 attached and
    # WG1200_PORT set in the runner environment (for example /dev/ttyUSB0).
    runs-on: [self-hosted, linux, ARM64, wg1200]
    env:
      WG1200_PORT: ${{ vars.WG1200_PORT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weatherxm-flash-linux-arm64
          path: dist
      - name: Verify attached WG1200 without writing firmware
        env:
          WG1200_BINARY: ./dist/weatherxm-flash-linux-arm64
        run: |
          chmod +x "$WG1200_BINARY"
          sh ./scripts/read-only-hardware-check.sh

  publish:
    needs: [build, read-only-hardware-gate]
    if: github.ref_name != 'v0.1.1-rc.1'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum weatherxm-flash-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Independent WeatherXM WG1200 CLI release. This project is not an official WeatherXM product or endorsement.

            **Maintainer-reported physical evidence:** the v0.1.0-rc.1 Linux ARM64 binary passed read-only startup, OTA metadata/CRC inspection, Secure Boot V2 boot, application startup, networking, MQTT, station reception, redacted/timestamped monitoring, and monitor cancellation on a Raspberry Pi 5 / WG1200. It did not write OTA metadata. Earlier development builds reportedly completed `ota_1 → ota_0 → ota_1`; that cycle was not performed by the RC or this final executable. See `docs/hardware-validation.md` for attribution and scope.

            **Safety and recovery:** the generic `flash <firmware>` installer remains blocked; a narrowly scoped WeatherXM stage-only application write is enabled with backup and confirmation safeguards. OTA activation and emergency restore write one 4 KiB metadata sector under explicit confirmation. Automatic rollback is not established. Emergency `ota restore` has automated tests but no physical recovery test. The stable v0.1.0 binary itself was not physically run.

            This job creates a draft. Review the documentation and provenance before publishing it.
          files: |
            release/weatherxm-flash-*
            release/SHA256SUMS

  alpine-arm64-musl-prerelease:
    if: github.ref_name == 'v0.1.1-rc.1'
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx on the ARM64 runner
        uses: docker/setup-buildx-action@v3
      - name: Build and test in Alpine ARM64
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg "WG1200_GIT_COMMIT=$RELEASE_COMMIT" \
            --build-arg "WG1200_GIT_TAG=$RELEASE_TAG" \
            --build-arg WG1200_GIT_DIRTY=false \
            --target clean-runtime-test \
            --tag weatherxm-wg1200:alpine-arm64-musl .
          mkdir -p release/weatherxm-wg1200-${RELEASE_TAG}-alpine-arm64-musl
          container_id=$(docker create weatherxm-wg1200:alpine-arm64-musl)
          docker cp "$container_id:/usr/local/bin/weatherxm-flash-linux-arm64-musl-v0.1.1" \
            "release/weatherxm-wg1200-${RELEASE_TAG}-alpine-arm64-musl/"
          docker rm "$container_id"
          package="release/weatherxm-wg1200-${RELEASE_TAG}-alpine-arm64-musl"
          cp LICENSE "$package/LICENSE"
          cp docs/alpine-home-assistant-install.md "$package/INSTALL.md"
          cp docs/release-v0.1.1.md "$package/RELEASE-NOTES.md"
          (cd "$package" && sha256sum weatherxm-flash-linux-arm64-musl-v0.1.1 > SHA256SUMS)
          tar -C release -czf "release/weatherxm-flash-linux-arm64-musl-${RELEASE_TAG}.tar.gz" \
            "weatherxm-wg1200-${RELEASE_TAG}-alpine-arm64-musl"
          (cd release && sha256sum "weatherxm-flash-linux-arm64-musl-${RELEASE_TAG}.tar.gz" > SHA256SUMS)
          tar -tzf "release/weatherxm-flash-linux-arm64-musl-${RELEASE_TAG}.tar.gz"
          (cd release && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          name: WeatherXM WG1200 CLI v0.1.1-rc.1 (Alpine ARM64 musl)
          body: |
            Pre-release candidate for remote testing on Alpine Linux ARM64, including the Home Assistant Terminal & SSH add-on. This is not the final v0.1.1 release and is not an official WeatherXM product or endorsement.

            The archive contains only the Alpine ARM64 musl executable, its executable checksum, installation instructions, release notes, and license. The executable was built and tested in a clean Alpine 3.24.3 ARM64 container; no Raspberry Pi or physical WG1200 validation is claimed. PTY checks cover serial data flow but do not verify DTR/RTS reset behavior.

            Download the `.tar.gz` and `SHA256SUMS`, verify the archive checksum, extract it, then verify the executable checksum using the included `SHA256SUMS`. See `INSTALL.md` for Home Assistant instructions. Review the safety documentation before connecting hardware.
          files: |
            release/weatherxm-flash-linux-arm64-musl-v0.1.1-rc.1.tar.gz
            release/SHA256SUMS
